apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  NEXT_PUBLIC_API_URL: "http://{{ include "todo-chatbot.fullname" . }}-backend:{{ .Values.backend.service.port }}"
  DATABASE_HOST: "{{ include "todo-chatbot.fullname" . }}-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.database.postgresql.auth.database | quote }}
  DATABASE_USER: {{ .Values.database.postgresql.auth.username | quote }}
  # AI Configuration - Models only (API keys in secrets)
  OPENROUTER_MODEL: {{ .Values.ai.openrouterModel | default "openai/gpt-3.5-turbo" | quote }}
  OPENAI_MODEL: {{ .Values.ai.openaiModel | default "gpt-3.5-turbo" | quote }}
  ANTHROPIC_MODEL: {{ .Values.ai.anthropicModel | default "claude-3-haiku-20240307" | quote }}
  GOOGLE_MODEL: {{ .Values.ai.googleModel | default "gemini-1.5-flash" | quote }}
  FALLBACK_MODEL: {{ .Values.ai.fallbackModel | default "gpt-3.5-turbo" | quote }}
  # Backend Configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  # MCP Server Configuration
  MCP_SERVER_HOST: "{{ include "todo-chatbot.fullname" . }}-mcp-server"
  MCP_SERVER_PORT: "8080"
  # Advanced Task Features Configuration
  ENABLE_ADVANCED_TASKS: "true"
  ENABLE_RECURRING_TASKS: "true"
  ENABLE_REMINDERS: "true"
  ENABLE_CATEGORIES: "true"
  ENABLE_DUE_DATES: "true"