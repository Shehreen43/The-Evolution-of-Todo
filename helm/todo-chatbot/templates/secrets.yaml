{{- if not .Values.database.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-db-secret
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.database.postgresql.auth.postgresPassword | b64enc | quote }}
  password: {{ .Values.database.postgresql.auth.password | b64enc | quote }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-backend-secrets
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ randAlphaNum 32 | b64enc | quote }}
  # AI API Keys (should be set via environment or external secret management)
  {{- if .Values.ai.openrouterApiKey }}
  openrouter-api-key: {{ .Values.ai.openrouterApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.openaiApiKey }}
  openai-api-key: {{ .Values.ai.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.anthropicApiKey }}
  anthropic-api-key: {{ .Values.ai.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.googleApiKey }}
  google-api-key: {{ .Values.ai.googleApiKey | b64enc | quote }}
  {{- end }}

---
# AI Configuration Secret (for production use with external secret management)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-ai-secrets
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.ai.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.ai.openrouterApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.ai.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.ai.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.googleApiKey }}
  GOOGLE_API_KEY: {{ .Values.ai.googleApiKey | b64enc | quote }}
  {{- end }}