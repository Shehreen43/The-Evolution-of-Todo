# Test environment values for todo-chatbot

frontend:
  replicaCount: 2
  image:
    repository: todo-frontend
    tag: "test-latest"
  service:
    type: NodePort
    port: 3000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: todo-chatbot.test.com
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      memory: "192Mi"
      cpu: "150m"
    limits:
      memory: "384Mi"
      cpu: "300m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

backend:
  replicaCount: 2
  image:
    repository: todo-backend
    tag: "test-latest"
  service:
    type: NodePort
    port: 8000
  resources:
    requests:
      memory: "384Mi"
      cpu: "200m"
    limits:
      memory: "768Mi"
      cpu: "400m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

mcpServer:
  replicaCount: 1
  image:
    repository: todo-mcp-server
    tag: "test-latest"
  service:
    type: NodePort
    port: 8080
  metricsPort: 8001
  resources:
    requests:
      memory: "192Mi"
      cpu: "150m"
    limits:
      memory: "384Mi"
      cpu: "300m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

database:
  postgresql:
    enabled: true
    auth:
      postgresPassword: "test-secure-postgres-password"
      username: "todo_test_user"
      password: "test-secure-user-password"
      database: "todo_test_database"
    primary:
      persistence:
        enabled: true
        size: 5Gi

# AI Configuration for Testing (using free models)
ai:
  openrouterApiKey: "sk-or-v1-test-key"  # Test API key
  openaiApiKey: "sk-test-key"           # Test API key
  anthropicApiKey: "sk-test-key"        # Test API key
  googleApiKey: "test-google-key"       # Test API key
  openrouterModel: "openai/gpt-3.5-turbo"  # Free tier available
  openaiModel: "gpt-3.5-turbo"             # Free tier available
  anthropicModel: "claude-3-haiku-20240307" # Free tier available
  googleModel: "gemini-1.5-flash"           # Free tier available
  fallbackModel: "gpt-3.5-turbo"            # Default fallback

# Test environment settings
podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001