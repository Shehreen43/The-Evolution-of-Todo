# Default values for todo-chatbot
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imagePullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  imageTag: ""

frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []

mcpServer:
  replicaCount: 1
  image:
    repository: todo-mcp-server
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  metricsPort: 8001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []

database:
  postgresql:
    enabled: true
    auth:
      postgresPassword: "secure-postgres-password"
      username: "todo_user"
      password: "secure-user-password"
      database: "todo_database"
    architecture: standalone
    primary:
      service:
        ports:
          postgresql: 5432

# AI Configuration
ai:
  openrouterApiKey: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  googleApiKey: ""
  openrouterModel: "openai/gpt-3.5-turbo"  # Free tier available
  openaiModel: "gpt-3.5-turbo"             # Free tier available
  anthropicModel: "claude-3-haiku-20240307" # Free tier available with Claude Pro subscription
  googleModel: "gemini-1.5-flash"           # More affordable than pro models
  fallbackModel: "gpt-3.5-turbo"            # Default fallback for free usage

# Common settings
podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001