apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-chatbot-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  todo-chatbot.json: |-
    {
      "dashboard": {
        "id": null,
        "title": "Todo Chatbot Application",
        "tags": ["todo", "chatbot", "application"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Frontend Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"todo-frontend\"}",
                "legendFormat": "Frontend Status"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Backend Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"todo-backend\"}",
                "legendFormat": "Backend Status"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Application Requests",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{ handler }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Response Times",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "{{ handler }} 95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }