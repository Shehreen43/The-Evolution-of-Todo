global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'todo-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'dapr'
    static_configs:
      - targets: ['backend:9090']  # Dapr sidecar metrics
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9308']  # Kafka JMX Exporter
    scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - "alertmanager:9093"