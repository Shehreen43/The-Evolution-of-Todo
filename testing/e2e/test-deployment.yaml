apiVersion: v1
kind: Pod
metadata:
  name: e2e-test-pod
  namespace: todo-app
spec:
  serviceAccountName: todo-app-sa
  containers:
  - name: e2e-tester
    image: curlimages/curl:latest
    command: ['sh', '-c']
    args:
    - |
      # Wait for services to be available
      echo "Testing frontend service..."
      curl -f http://frontend-service:3000/health || exit 1
      echo "Testing backend service..."
      curl -f http://backend-service:8000/health || exit 1
      echo "All services are healthy!"
  restartPolicy: Never